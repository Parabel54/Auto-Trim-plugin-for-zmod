# Deep Calibration Development Beta 0.1.0-beta.7: the strict soak calibration, and the optional AD5X print start (off: Auto Trim prepares prints).
# Adapted from the previously reviewed Live Z Mesh preparation macros.
# Included by deep_calibration.cfg. The print start below is only used with startup_integration: True.

[gcode_macro DEEP_CALIBRATION_START_PRINT]
description: One zMod startup followed by one Deep Calibration preparation
gcode:
    {% set p = printer['gcode_macro DEEP_CALIBRATION_PREPARE'] %}
    {% set vars = printer.save_variables.variables %}
    {% set client = printer['gcode_macro _CLIENT_VARIABLE'] %}
    {% set cmds = printer.gcode.commands %}
    {% if p.running or p.prepared %}
        { action_raise_error("DEEP CALIBRATION: startup already running or completed. Do not call it twice; cancel a failed print before DEEP_CALIBRATION_RESET.") }
    {% endif %}
    {% if not client.ad5x or printer['gcode_macro _SCREEN'].screen %}
        { action_raise_error("DEEP CALIBRATION: this adapter requires AD5X with zMod native screen disabled") }
    {% endif %}
    {% if 'gcode_macro AUTO_TRIM_PREPARE' in printer %}
        { action_raise_error("DEEP CALIBRATION: remove the Auto Trim include before using this startup adapter") }
    {% endif %}
    {% if printer['gcode_macro DEEP_CALIBRATION_SOAK_CALIBRATE'].running %}
        { action_raise_error("DEEP CALIBRATION: finish or abort soak calibration before printing") }
    {% endif %}
    {% if vars.get('print_leveling',0)|int != 0 or vars.get('mesh_test',1)|int != 0 or vars.get('disable_priming',0)|int != 1 %}
        { action_raise_error("DEEP CALIBRATION: first run SAVE_ZMOD_DATA PRINT_LEVELING=0 MESH_TEST=0 DISABLE_PRIMING=1 to avoid duplicate startup actions") }
    {% endif %}
    {% if 'DEEP_CALIBRATION_MESH_REQUIRE' not in cmds %}
        { action_raise_error("DEEP CALIBRATION: install the complete Deep Calibration package and include deep_calibration.cfg") }
    {% endif %}
    {% set mesh = params.DC_MESH|default(p.mesh)|upper %}
    {% set soak = params.DC_SOAK|default(p.soak)|string|upper %}
    {% set ext = params.EXTRUDER_TEMP|default(230)|float %}
    {% set bed = params.BED_TEMP|default(60)|float %}
    {% set ecfg = printer.configfile.settings.extruder %}
    {% set bcfg = printer.configfile.settings.heater_bed %}
    {% if mesh not in ['FULL','KAMP'] or (mesh == 'KAMP' and '_KAMP_BED_MESH_CALIBRATE' not in cmds) %}
        { action_raise_error("DEEP CALIBRATION: DC_MESH must be FULL, or KAMP with KAMP installed") }
    {% endif %}
    {% if soak not in ['AUTO','OFF'] and not (soak|float(-1) >= 0 and soak|float(-1) <= p.soak_max|float) %}
        { action_raise_error("DEEP CALIBRATION: invalid DC_SOAK") }
    {% endif %}
    {% if not (ext >= ecfg.min_extrude_temp|default(170)|float and ext < ecfg.max_temp|float and bed > 0 and bed < bcfg.max_temp|float) %}
        { action_raise_error("DEEP CALIBRATION: print temperatures outside configured limits") }
    {% endif %}
    {% if soak == 'AUTO' %}
        {% set key = 'soak_t' ~ bed|round|int %}
        {% if key not in vars or vars.get(key ~ '_method',0)|int != 2 or vars.get(key ~ '_points',0)|int != 5 %}
            { action_raise_error('DEEP CALIBRATION: run strict five-point SOAK_CALIBRATE at this BED temperature first, or explicitly choose DC_SOAK=seconds/OFF; old smoothed calibration is not trusted') }
        {% endif %}
        {% set verified = [vars[key]|float,vars.get(key ~ '_corners',0)|float]|max %}
        {% if verified != verified or verified <= 0 or verified > p.soak_max|float %}
            { action_raise_error('DEEP CALIBRATION: verified soak is invalid or above the configured limit') }
        {% endif %}
    {% endif %}
    {% set cool = vars.get('temp_test_max',151)|float if ext > 230 else vars.get('temp_test_min',121)|float %}
    {% if not (cool > 0 and cool < ext) or not (p.cool_wipe_step|float == 0 or p.cool_wipe_step|float >= 1) %}
        { action_raise_error("DEEP CALIBRATION: invalid probe temperature or cooling wipe step") }
    {% endif %}
    SET_GCODE_VARIABLE MACRO=DEEP_CALIBRATION_PREPARE VARIABLE=running VALUE=True
    SET_GCODE_VARIABLE MACRO=DEEP_CALIBRATION_PREPARE VARIABLE=idle_temp VALUE={printer.heater_bed.temperature|float}
    SET_GCODE_VARIABLE MACRO=DEEP_CALIBRATION_PREPARE VARIABLE=t0 VALUE=0.0
    SET_GCODE_VARIABLE MACRO=DEEP_CALIBRATION_PREPARE VARIABLE=request_ext VALUE={ext}
    SET_GCODE_VARIABLE MACRO=DEEP_CALIBRATION_PREPARE VARIABLE=request_bed VALUE={bed}
    SET_GCODE_VARIABLE MACRO=DEEP_CALIBRATION_PREPARE VARIABLE=request_mesh VALUE='"{mesh}"'
    SET_GCODE_VARIABLE MACRO=DEEP_CALIBRATION_PREPARE VARIABLE=request_soak VALUE='"{soak}"'
    {% set forwarded = [] %}
    {% for k,v in params.items() if k not in ['SKIP_LEVELING','FORCE_KAMP','FORCE_LEVELING','MESH','DC_MESH','DC_SOAK','EXTRUDER_TEMP','BED_TEMP'] %}
        {% set _ = forwarded.append(k ~ '=' ~ v) %}
    {% endfor %}
    _DEEP_CALIBRATION_BASE_START_PRINT {forwarded|join(' ')} EXTRUDER_TEMP={ext} BED_TEMP={bed} SKIP_LEVELING=True FORCE_KAMP=False FORCE_LEVELING=False MESH=""
    DEEP_CALIBRATION_PREPARE

[gcode_macro _DEEP_CALIBRATION_PRECLEAN]
description: Skip zMod pre-clean only while this startup owns the cleaning cycle
gcode:
    {% if printer['gcode_macro DEEP_CALIBRATION_PREPARE'].running %}
        RESPOND PREFIX="info" MSG="DEEP CALIBRATION: pre-clean deferred to the single custom cooling-wipe cycle"
    {% else %}
        _DEEP_CALIBRATION_BASE_PRECLEAN {rawparams}
    {% endif %}

[gcode_macro DEEP_CALIBRATION_PREPARE]
description: Internal startup stage; use START_PRINT once, not a second slicer line
variable_mesh: "FULL"
variable_soak: "AUTO"
variable_soak_max: 7200.0
variable_cool_wipe_step: 25
variable_running: False
variable_prepared: False
variable_idle_temp: -1.0
variable_t0: 0.0
variable_request_ext: 230.0
variable_request_bed: 60.0
variable_request_mesh: "FULL"
variable_request_soak: "AUTO"
gcode:
    {% if not running or prepared or 'xyz' not in printer.toolhead.homed_axes %}
        { action_raise_error("DEEP CALIBRATION: preparation requires one successful zMod START_PRINT; do not call PREPARE separately") }
    {% endif %}
    {% set v = printer.toolhead.max_velocity|float %}
    {% set a = printer.toolhead.max_accel|float %}
    SAVE_GCODE_STATE NAME=_deep_calibration_prepare
    G90
    M83
    BED_MESH_CLEAR
    _DEEP_CALIBRATION_TRASH_CLEAN EXTRUDER_TEMP={request_ext} BED_TEMP={request_bed}
    _DEEP_CALIBRATION_SOAK SOAK={request_soak}
    M400
    G4 P1000
    LOAD_CELL_TARE
    {% if request_mesh == 'FULL' %}
        _BED_MESH_CALIBRATE PROFILE=default
    {% else %}
        _KAMP_BED_MESH_CALIBRATE
    {% endif %}
    M400
    _DEEP_CALIBRATION_TRASH_FINISH EXTRUDER_TEMP={request_ext} BED_TEMP={request_bed} TIP=3
    DEEP_CALIBRATION_MESH_REQUIRE
    DEEP_CALIBRATION_MESH_STATUS
    SET_VELOCITY_LIMIT VELOCITY={v} ACCEL={a}
    RESTORE_GCODE_STATE NAME=_deep_calibration_prepare MOVE=0
    SET_GCODE_VARIABLE MACRO=DEEP_CALIBRATION_PREPARE VARIABLE=prepared VALUE=True
    SET_GCODE_VARIABLE MACRO=DEEP_CALIBRATION_PREPARE VARIABLE=running VALUE=False
    UPDATE_DELAYED_GCODE ID=_DEEP_CALIBRATION_LIFECYCLE DURATION=5
    RESPOND PREFIX="info" MSG="DEEP CALIBRATION: ready; requested print temperature restored, mesh active; run DEEP_CALIBRATION_MESH_TRACE during the first layer"

[gcode_macro _DEEP_CALIBRATION_SOAK_MARK]
gcode:
    SET_GCODE_VARIABLE MACRO=DEEP_CALIBRATION_PREPARE VARIABLE=t0 VALUE={printer.deep_calibration.host_time|float}

[delayed_gcode _DEEP_CALIBRATION_LIFECYCLE]
gcode:
    {% if printer.print_stats.state in ['printing','paused'] %}
        UPDATE_DELAYED_GCODE ID=_DEEP_CALIBRATION_LIFECYCLE DURATION=5
    {% else %}
        DEEP_CALIBRATION_RESET
    {% endif %}

[gcode_macro DEEP_CALIBRATION_RESET]
description: Clear startup latch only after the print has ended or been cancelled
gcode:
    {% if printer.print_stats.state in ['printing','paused'] %}
        { action_raise_error("DEEP CALIBRATION: cancel or finish the print before resetting startup") }
    {% endif %}
    SET_GCODE_VARIABLE MACRO=DEEP_CALIBRATION_PREPARE VARIABLE=running VALUE=False
    SET_GCODE_VARIABLE MACRO=DEEP_CALIBRATION_PREPARE VARIABLE=prepared VALUE=False
    SET_GCODE_VARIABLE MACRO=_DEEP_CALIBRATION_SAFE_WIPE VARIABLE=retracted VALUE=0.0

[gcode_macro _DEEP_CALIBRATION_TRASH_CLEAN]
description: Internal (AD5X): purge into the trash chute, cool there, then wipe on the rubber
gcode:
    {% set ext = params.EXTRUDER_TEMP|float %}
    {% set bed = params.BED_TEMP|float %}
    {% set vars = printer.save_variables.variables %}
    {% set cool = vars.get("temp_test_max", 151)|int if ext > 230 else vars.get("temp_test_min", 121)|int %}
    RESPOND PREFIX="info" MSG="DEEP CALIBRATION: nozzle clean at the trash chute: purge and wipe at {ext|int} C, cool to {cool} C at the chute with a wipe every {printer['gcode_macro DEEP_CALIBRATION_PREPARE'].cool_wipe_step|int} C, then wipe again"
    SET_GCODE_VARIABLE MACRO=_DEEP_CALIBRATION_SAFE_WIPE VARIABLE=retracted VALUE=0.0
    _GOTO_TRASH
    G1 Z20 F600
    M140 S{bed}
    M104 S{ext} T0
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed - 3} MAXIMUM={bed + 4}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={ext - 2} MAXIMUM={ext + 4}
    M400
    _DEEP_CALIBRATION_SOAK_MARK
    M106 S255
    G92 E0
    G1 E10 F400
    G92 E0
    G1 E-3 F1000
    M400
    G92 E0
    _DEEP_CALIBRATION_SAFE_WIPE CLEAR_NOZ=1
    _GOTO_TRASH
    M104 S{cool} T0
    {% set step = printer["gcode_macro DEEP_CALIBRATION_PREPARE"].cool_wipe_step|float %}
    {% if step > 0 %}
        {% for k in range(1, ((ext - cool) / step)|int + 1) %}
            {% set t = ext - k * step %}
            {% if t > cool + 5 %}
                TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={t}
                RESPOND PREFIX="info" MSG="DEEP CALIBRATION: wiping while cooling ({t|int} C)"
                _DEEP_CALIBRATION_SAFE_WIPE CLEAR_NOZ=1
                _GOTO_TRASH
            {% endif %}
        {% endfor %}
    {% endif %}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={cool - 3} MAXIMUM={cool + 3}
    _DEEP_CALIBRATION_SAFE_WIPE CLEAR_NOZ=1
    M106 S0
    G1 Z5 F6000
    M400
    G4 P2000


[gcode_macro _DEEP_CALIBRATION_TRASH_FINISH]
description: Internal (AD5X): reheat, wipe with original motions, then restore the probe and wipe retractions
gcode:
    {% set ext = params.EXTRUDER_TEMP|float %}
    {% set bed = params.BED_TEMP|float %}
    {% set tip = params.TIP|default(0)|float %}
    _GOTO_TRASH
    M190 S{bed}
    M109 S{ext}
    M400
    _DEEP_CALIBRATION_SAFE_WIPE CLEAR_NOZ=1
    M400
    _DEEP_CALIBRATION_RESTORE_WIPES TIP={tip}
    RESPOND PREFIX="info" MSG="DEEP CALIBRATION: requested {ext|int} C restored after probing, original wipe motions complete"


[gcode_macro _DEEP_CALIBRATION_SAFE_WIPE]
description: Internal: preserve stock wipe motions, retract only when extrusion is permitted
variable_retracted: 0.0
gcode:
    {% set clear_noz = params.CLEAR_NOZ|default(0)|int %}
    SAVE_GCODE_STATE NAME=_deep_calibration_safe_wipe
    M83
    {% set min_ext = printer.configfile.settings.extruder.min_extrude_temp|default(170)|float %}
    {% if printer.extruder.can_extrude and printer.extruder.target|float >= min_ext %}
        _CLEAR_REZINA CLEAR_NOZ={clear_noz}
        SET_GCODE_VARIABLE MACRO=_DEEP_CALIBRATION_SAFE_WIPE VARIABLE=retracted VALUE={retracted|float + 2.0}
    {% else %}
        _DEEP_CALIBRATION_COLD_WIPE CLEAR_NOZ={clear_noz}
    {% endif %}
    RESTORE_GCODE_STATE NAME=_deep_calibration_safe_wipe MOVE=0

# XYZ movement body from uploaded zMod 1.7.5 _CLEAR_REZINA,
# (C) 2024-2026 ghzserg https://zmod.link/; extrusion omitted while cold.

[gcode_macro _DEEP_CALIBRATION_COLD_WIPE]
description: Internal: uploaded zMod 1.7.5 wipe path and speeds, with no cold extrusion
gcode:

    SET_VELOCITY_LIMIT VELOCITY=600 ACCEL=20000
    {% set client = printer['gcode_macro _CLIENT_VARIABLE'] | default({}) %}
    {% set clear_noz = params.CLEAR_NOZ|default(0)|int %}

    RESPOND PREFIX="info" MSG="Cleaning the nozzle on rubber"

    _PREPARE_GOTO_TRASH_OR_WIPE

    M400
    {% if clear_noz == 1 %}
    G1 Y{client.custom_park_y-20} F5000 ; выезд из мусорки
    G1 Y{client.custom_park_y} F5000    ; заезд обратно в мусорку
    G1 Y{client.custom_park_y-20} F5000 ; выезд из мусорки
    G1 Y{client.custom_park_y} F5000    ; заезд обратно в мусорку
    G1 Y{client.custom_park_y-20} F5000 ; выезд из мусорки
    G1 Y{client.custom_park_y} F5000    ; заезд обратно в мусорку
    {% endif %}

    G1 Y{client.custom_park_y-20} F15000 ; выезд из мусорки
    G1 X70 F12000       ; 1/4 резинки по X
    G1 Y{client.custom_park_y} F3000    ; заезд на резинку по Y
    G1 X78 F12000       ; 3/4 резинки по X
    G1 X65 F12000       ; 1/4 резинки по X

    G1 X80 F22000             ; 1/2 резинки по X
    G1 X65 F22000             ; 1/4 резинки по X
    G1 X80 F22000             ; 1/2 резинки по X
    G1 X65 F22000             ; 1/4 резинки по X
    G1 X80 F22000             ; 1/2 резинки по X
    G1 X65 F22000             ; 1/4 резинки по X

    G1 X81 F6000             ; 1/2 резинки по X
    G1 X65 F6000             ; 1/4 резинки по X
    G1 X81 F6000             ; 1/2 резинки по X
    G1 X65 F6000             ; 1/4 резинки по X
    G1 X81 F6000             ; 1/2 резинки по X
    G1 X65 F6000             ; 1/4 резинки по X

    G1 Y{client.max_y} F22000 ; выезд с резинки
    M400


[gcode_macro _DEEP_CALIBRATION_RESTORE_WIPES]
description: Internal: restore the explicit probe retract and all hot-wipe retracts after reheating
gcode:
    {% set tip = params.TIP|default(0)|float %}
    {% set wipes = printer["gcode_macro _DEEP_CALIBRATION_SAFE_WIPE"].retracted|float %}
    {% set restore = tip + wipes %}
    {% if restore > 0 %}
        {% if not printer.extruder.can_extrude %}
            { action_raise_error("DEEP CALIBRATION: reheating did not enable extrusion, refusing to prime cold") }
        {% endif %}
        SAVE_GCODE_STATE NAME=_deep_calibration_tip
        M83
        G1 E{restore} F300
        G92 E0
        RESTORE_GCODE_STATE NAME=_deep_calibration_tip MOVE=0
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_DEEP_CALIBRATION_SAFE_WIPE VARIABLE=retracted VALUE=0.0
    RESPOND PREFIX="info" MSG="DEEP CALIBRATION: restored {restore} mm after the final wipe"


[gcode_macro _DEEP_CALIBRATION_SOAK]
description: Internal: wait for what is left of the bed heat soak before probing
gcode:
    {% set p = printer["gcode_macro DEEP_CALIBRATION_PREPARE"] %}
    {% set w = printer["gcode_macro DEEP_CALIBRATION_PREPARE"] %}
    {% set vars = printer.save_variables.variables %}
    {% set mode = params.SOAK|default("AUTO")|string|upper %}
    {% set target = printer.heater_bed.target|float %}
    {% set now = printer.deep_calibration.host_time|float %}
    {% set rise = target - w.idle_temp|float %}
    {% if mode not in ["AUTO", "OFF"] and mode|float(-1) < 0 %}
        { action_raise_error("DEEP CALIBRATION: SOAK must be AUTO, OFF or seconds") }
    {% endif %}
    {% if mode == "OFF" %}
        {% set s = 0.0 %}
        {% set why = "off" %}
    {% elif mode|float(-1) >= 0 %}
        {% set s = mode|float %}
        {% set why = "SOAK=" ~ mode %}
    {% else %}
        {% set key = 'soak_t' ~ target|round|int %}
        {% if key not in vars or vars.get(key ~ '_method',0)|int != 2 or vars.get(key ~ '_points',0)|int != 5 %}
            { action_raise_error('DEEP CALIBRATION: AUTO needs a strict five-point soak calibration at this bed temperature; legacy smoothed times are not accepted') }
        {% endif %}
        {% set s = [vars[key]|float,vars.get(key ~ '_corners',0)|float]|max %}
        {% if s != s or s <= 0 or s > p.soak_max|float %}
            { action_raise_error('DEEP CALIBRATION: saved verified soak exceeds the configured limit; it will not be silently shortened') }
        {% endif %}
        {% set why = 'strict verified calibration at ' ~ target|round|int ~ ' C (no warm-start reduction)' %}
    {% endif %}
    {% set elapsed = [now - w.t0|float, 0]|max if w.t0|float > 0 else 0.0 %}
    {% set left = (s - elapsed)|round|int %}
    {% if s > 0 %}
        {% if left > 0 %}
            RESPOND PREFIX="info" MSG="DEEP CALIBRATION: bed heat soak {s|round|int} s ({why}, bed started at {w.idle_temp|round|int} C), {elapsed|round|int} s covered by the nozzle clean, waiting {left} s"
            M400
            {% for i in range((left / 15)|round(0, "ceil")|int) %}
                {% set chunk = [15, left - i * 15]|min %}
                G4 P{(chunk * 1000)|int}
                RESPOND PREFIX="info" MSG="DEEP CALIBRATION: bed heat soak, {left - i * 15 - chunk} s left"
            {% endfor %}
            M400
            G4 P1000
        {% else %}
            RESPOND PREFIX="info" MSG="DEEP CALIBRATION: bed heat soak {s|round|int} s ({why}, bed started at {w.idle_temp|round|int} C) already covered by the {elapsed|round|int} s nozzle clean"
        {% endif %}
    {% else %}
        RESPOND PREFIX="info" MSG="DEEP CALIBRATION: no bed heat soak ({why})"
    {% endif %}


[gcode_macro DEEP_CALIBRATION_SOAK_CALIBRATE]
description: Strict idle soak calibration: BED=60 POINTS=5 INTERVAL=90 STABLE=0.01 WINDOW=600 MIN_SOAK=600 MAX=2700 SAMPLES=2 REPEAT=0.01 CONFIRM=2 DRIFT=0.001
variable_running: False
variable_bed: 0
variable_from: 0.0
variable_nozzle: 121.0
variable_npts: 5
variable_interval: 90.0
variable_stable: 0.01
variable_window: 600.0
variable_min_soak: 600.0
variable_max: 2700.0
variable_samples: 2
variable_probe_speed: 1.0
variable_second_probe_speed: 1.0
variable_repeat: 0.01
variable_retries: 3
variable_confirm: 2
variable_confirm_count: 0
variable_min_rounds: 6
variable_drift_limit: 0.001
variable_last_good: False
variable_last_result: "NOT_RUN"
variable_t0: 0.0
variable_round_started: 0.0
variable_rows: []
variable_cur: []
variable_rejected_rounds: []
variable_point_valid: False
variable_point_z: 0.0
variable_point_status: []
variable_bed_band_start: 3.0
variable_bed_band_final: 1.0
variable_temp_grace: 300.0
variable_thermal_status: {}
variable_point_measured: False
variable_raw_cur: []
variable_raw_rows: []
gcode:
    {% set bed = params.BED|default(0)|float %}
    {% set npts = params.POINTS|default(5)|int %}
    {% set vars = printer.save_variables.variables %}
    {% set noz = params.NOZZLE|default(vars.get('temp_test_min',121))|float %}
    {% set nsoak = params.NOZZLE_SOAK|default(300)|float %}
    {% set ival = params.INTERVAL|default(90)|float %}
    {% set stab = params.STABLE|default(0.01)|float %}
    {% set win = params.WINDOW|default(600)|float %}
    {% set minimum = params.MIN_SOAK|default(600)|float %}
    {% set mx = params.MAX|default(2700)|float %}
    {% set samples = params.SAMPLES|default(2)|int %}
    {% set first_speed = params.PROBE_SPEED|default(1)|float %}
    {% set second_speed = params.SECOND_PROBE_SPEED|default(1)|float %}
    {% set bed_band_start = params.BED_BAND_START|default(3)|float %}
    {% set bed_band_final = params.BED_BAND_FINAL|default(1)|float %}
    {% set temp_grace = params.TEMP_GRACE|default(300)|float %}
    {% if not (0.1 <= bed_band_final <= 3 and bed_band_final <= bed_band_start <= 10 and 0 <= temp_grace <= 1800) %}
        { action_raise_error('DEEP CALIBRATION: invalid gradual temperature guard parameters') }
    {% endif %}
    {% set repeat = params.REPEAT|default(stab)|float %}
    {% set retries = params.RETRIES|default(3)|int %}
    {% set confirm = params.CONFIRM|default(2)|int %}
    {% set rounds = params.MIN_ROUNDS|default(6)|int %}
    {% set drift = params.DRIFT|default(0.001)|float %}
    {% for key,value in [('POINTS',npts),('SAMPLES',samples),('RETRIES',retries),('CONFIRM',confirm),('MIN_ROUNDS',rounds)] %}
        {% if params.get(key,value)|float != value %}
            { action_raise_error('DEEP CALIBRATION: ' ~ key ~ ' must be an integer') }
        {% endif %}
    {% endfor %}
    {% if bed != bed|round %}
        { action_raise_error('DEEP CALIBRATION: use a whole-degree BED calibration temperature') }
    {% endif %}
    {% if not (first_speed > 0 and first_speed <= 10 and second_speed > 0 and second_speed <= 10) %}
        { action_raise_error('DEEP CALIBRATION: probe speeds must be in (0,10] mm/s') }
    {% endif %}
    {% set start = printer.heater_bed.temperature|float %}
    {% set ecfg = printer.configfile.settings.extruder %}
    {% set bcfg = printer.configfile.settings.heater_bed %}
    {% for value in [bed,noz,nsoak,ival,stab,win,minimum,mx,repeat,drift] %}
        {% if value != value or value|abs > 100000 %}
            { action_raise_error('DEEP CALIBRATION: soak parameters must be finite') }
        {% endif %}
    {% endfor %}
    {% if running or printer.deep_calibration.recording or printer.print_stats.state in ['printing','paused'] %}
        { action_raise_error('DEEP CALIBRATION: soak calibration requires idle, no capture and no other soak run') }
    {% endif %}
    {% if bed < 40 or bed > 110 or bed >= bcfg.max_temp|float or noz <= 0 or noz >= ecfg.max_temp|float or npts not in [1,5] %}
        { action_raise_error('DEEP CALIBRATION: invalid bed/nozzle temperature or POINTS (1 or 5)') }
    {% endif %}
    {% if nsoak < 0 or nsoak > 3600 or ival < 10 or ival > 300 or stab <= 0 or stab > 0.1 or repeat <= 0 or repeat > 0.1 or drift <= 0 or drift > 0.1 %}
        { action_raise_error('DEEP CALIBRATION: invalid soak timing, STABLE, REPEAT or DRIFT') }
    {% endif %}
    {% if samples < 2 or samples > 15 or retries < 0 or retries > 10 or confirm < 2 or confirm > 5 or rounds < 4 or rounds > 30 %}
        { action_raise_error('DEEP CALIBRATION: SAMPLES must be 2..15; RETRIES 0..10; CONFIRM 2..5; MIN_ROUNDS 4..30') }
    {% endif %}
    {% if win < 120 or win > 3600 or win < (rounds - 1) * ival or minimum < 0 or minimum > 3600 or mx > 7200 or mx < [win,minimum]|max + ival * (confirm - 1) %}
        { action_raise_error('DEEP CALIBRATION: WINDOW/MAX cannot cover the requested rounds and confirmation time') }
    {% endif %}
    {% if start >= 40 and not params.FORCE|default(0)|int %}
        { action_raise_error('DEEP CALIBRATION: start below 40 C; FORCE=1 bypasses this but is not a cold-start calibration') }
    {% endif %}
    {% set bcfg = printer.configfile.settings.bed_mesh %}
    {% set bmin = bcfg.mesh_min %}
    {% set bmax = bcfg.mesh_max %}
    {% if npts == 5 and (bmax[0]-bmin[0] <= 60 or bmax[1]-bmin[1] <= 60) %}
        { action_raise_error('DEEP CALIBRATION: configured mesh bounds cannot fit five inset points') }
    {% endif %}
    SET_GCODE_VARIABLE MACRO=DEEP_CALIBRATION_SOAK_CALIBRATE VARIABLE=bed_band_start VALUE={bed_band_start}
    SET_GCODE_VARIABLE MACRO=DEEP_CALIBRATION_SOAK_CALIBRATE VARIABLE=bed_band_final VALUE={bed_band_final}
    SET_GCODE_VARIABLE MACRO=DEEP_CALIBRATION_SOAK_CALIBRATE VARIABLE=temp_grace VALUE={temp_grace}
    SET_GCODE_VARIABLE MACRO=DEEP_CALIBRATION_SOAK_CALIBRATE VARIABLE=raw_rows VALUE="[]"
    SET_GCODE_VARIABLE MACRO=DEEP_CALIBRATION_SOAK_CALIBRATE VARIABLE=thermal_status VALUE="{ {} }"
    SET_GCODE_VARIABLE MACRO=DEEP_CALIBRATION_SOAK_CALIBRATE VARIABLE=running VALUE=True
    SET_GCODE_VARIABLE MACRO=DEEP_CALIBRATION_SOAK_CALIBRATE VARIABLE=bed VALUE={bed|round|int}
    SET_GCODE_VARIABLE MACRO=DEEP_CALIBRATION_SOAK_CALIBRATE VARIABLE=from VALUE={start|round(1)}
    SET_GCODE_VARIABLE MACRO=DEEP_CALIBRATION_SOAK_CALIBRATE VARIABLE=nozzle VALUE={noz}
    SET_GCODE_VARIABLE MACRO=DEEP_CALIBRATION_SOAK_CALIBRATE VARIABLE=npts VALUE={npts}
    SET_GCODE_VARIABLE MACRO=DEEP_CALIBRATION_SOAK_CALIBRATE VARIABLE=interval VALUE={ival}
    SET_GCODE_VARIABLE MACRO=DEEP_CALIBRATION_SOAK_CALIBRATE VARIABLE=stable VALUE={stab}
    SET_GCODE_VARIABLE MACRO=DEEP_CALIBRATION_SOAK_CALIBRATE VARIABLE=window VALUE={win}
    SET_GCODE_VARIABLE MACRO=DEEP_CALIBRATION_SOAK_CALIBRATE VARIABLE=min_soak VALUE={minimum}
    SET_GCODE_VARIABLE MACRO=DEEP_CALIBRATION_SOAK_CALIBRATE VARIABLE=max VALUE={mx}
    SET_GCODE_VARIABLE MACRO=DEEP_CALIBRATION_SOAK_CALIBRATE VARIABLE=samples VALUE={samples}
    SET_GCODE_VARIABLE MACRO=DEEP_CALIBRATION_SOAK_CALIBRATE VARIABLE=probe_speed VALUE={first_speed}
    SET_GCODE_VARIABLE MACRO=DEEP_CALIBRATION_SOAK_CALIBRATE VARIABLE=second_probe_speed VALUE={second_speed}
    SET_GCODE_VARIABLE MACRO=DEEP_CALIBRATION_SOAK_CALIBRATE VARIABLE=repeat VALUE={repeat}
    SET_GCODE_VARIABLE MACRO=DEEP_CALIBRATION_SOAK_CALIBRATE VARIABLE=retries VALUE={retries}
    SET_GCODE_VARIABLE MACRO=DEEP_CALIBRATION_SOAK_CALIBRATE VARIABLE=confirm VALUE={confirm}
    SET_GCODE_VARIABLE MACRO=DEEP_CALIBRATION_SOAK_CALIBRATE VARIABLE=min_rounds VALUE={rounds}
    SET_GCODE_VARIABLE MACRO=DEEP_CALIBRATION_SOAK_CALIBRATE VARIABLE=drift_limit VALUE={drift}
    SET_GCODE_VARIABLE MACRO=DEEP_CALIBRATION_SOAK_CALIBRATE VARIABLE=confirm_count VALUE=0
    SET_GCODE_VARIABLE MACRO=DEEP_CALIBRATION_SOAK_CALIBRATE VARIABLE=last_good VALUE=False
    SET_GCODE_VARIABLE MACRO=DEEP_CALIBRATION_SOAK_CALIBRATE VARIABLE=last_result VALUE='"RUNNING"'
    SET_GCODE_VARIABLE MACRO=DEEP_CALIBRATION_SOAK_CALIBRATE VARIABLE=rows VALUE="[]"
    SET_GCODE_VARIABLE MACRO=DEEP_CALIBRATION_SOAK_CALIBRATE VARIABLE=point_status VALUE="[]"
    SET_GCODE_VARIABLE MACRO=DEEP_CALIBRATION_SOAK_CALIBRATE VARIABLE=rejected_rounds VALUE="[]"
    SET_GCODE_VARIABLE MACRO=DEEP_CALIBRATION_SOAK_CALIBRATE VARIABLE=point_valid VALUE=False
    RESPOND PREFIX="info" MSG="DEEP CALIBRATION: strict soak at {bed|int} C; {npts} points; {samples} median samples each, first speed {first_speed} mm/s then {second_speed} mm/s, with {repeat} mm repeatability; unsmoothed round range <= {stab} mm across at least {win|int} s, slope <= {drift} mm/min, {confirm} consecutive passes; minimum {minimum|int} s, MAX {mx|int} s. Verified acceptance time will be saved, not an earlier guessed settling time."
    BED_MESH_CLEAR
    _G28
    G90
    G1 X{(bmin[0]+bmax[0])/2} Y{(bmin[1]+bmax[1])/2} Z10 F6000
    M106 S0
    M104 S{noz}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={noz-2} MAXIMUM={noz+2}
    G4 P{(nsoak*1000)|int}
    M400
    M140 S{bed}
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed-1} MAXIMUM={bed+1}
    _DEEP_CALIBRATION_SOAK_BEGIN

[gcode_macro _DEEP_CALIBRATION_SOAK_BEGIN]
gcode:
    SET_GCODE_VARIABLE MACRO=DEEP_CALIBRATION_SOAK_CALIBRATE VARIABLE=t0 VALUE={printer.deep_calibration.host_time|float}
    _DEEP_CALIBRATION_SOAK_ROUND

[delayed_gcode _DEEP_CALIBRATION_SOAK_TICK]
gcode:
    _DEEP_CALIBRATION_SOAK_ROUND

[gcode_macro _DEEP_CALIBRATION_SOAK_ROUND]
gcode:
    {% set c = printer['gcode_macro DEEP_CALIBRATION_SOAK_CALIBRATE'] %}
    {% if c.running and printer.print_stats.state in ['printing','paused'] %}
        SET_GCODE_VARIABLE MACRO=DEEP_CALIBRATION_SOAK_CALIBRATE VARIABLE=running VALUE=False
        SET_GCODE_VARIABLE MACRO=DEEP_CALIBRATION_SOAK_CALIBRATE VARIABLE=last_result VALUE='"PRINT_INTERRUPTED"'
        UPDATE_DELAYED_GCODE ID=_DEEP_CALIBRATION_SOAK_TICK DURATION=0
        RESPOND PREFIX="!!" MSG="DEEP CALIBRATION: print interrupted calibration; nothing saved; print heaters left unchanged"
    {% elif c.running %}
        {% set bounds = printer.configfile.settings.bed_mesh %}
        {% set lo = bounds.mesh_min %}
        {% set hi = bounds.mesh_max %}
        {% set pts = [[(lo[0]+hi[0])/2,(lo[1]+hi[1])/2]] %}
        {% if c.npts == 5 %}
            {% set pts = pts + [[lo[0]+30,lo[1]+30],[hi[0]-30,lo[1]+30],[hi[0]-30,hi[1]-30],[lo[0]+30,hi[1]-30]] %}
        {% endif %}
        SET_GCODE_VARIABLE MACRO=DEEP_CALIBRATION_SOAK_CALIBRATE VARIABLE=round_started VALUE={printer.deep_calibration.host_time|float}
        SET_GCODE_VARIABLE MACRO=DEEP_CALIBRATION_SOAK_CALIBRATE VARIABLE=cur VALUE="[]"
        SET_GCODE_VARIABLE MACRO=DEEP_CALIBRATION_SOAK_CALIBRATE VARIABLE=raw_cur VALUE="[]"
        SAVE_GCODE_STATE NAME=_deep_calibration_soak_round
        G90
        {% for pt in pts %}
            _DEEP_CALIBRATION_SOAK_POINT X={pt[0]} Y={pt[1]}
        {% endfor %}
        RESTORE_GCODE_STATE NAME=_deep_calibration_soak_round MOVE=0
        M400
        _DEEP_CALIBRATION_SOAK_EVAL
    {% endif %}

[gcode_macro _DEEP_CALIBRATION_SOAK_POINT]
gcode:
    {% if printer['gcode_macro DEEP_CALIBRATION_SOAK_CALIBRATE'].running %}
        G1 Z5 F1800
        G1 X{params.X|float} Y{params.Y|float} F12000
        M400
        G4 P1000
        _DEEP_CALIBRATION_SOAK_PROBE
        G1 Z5 F1800
        _DEEP_CALIBRATION_SOAK_REC
    {% endif %}

[gcode_macro _DEEP_CALIBRATION_SOAK_REC]
gcode:
    {% set c = printer['gcode_macro DEEP_CALIBRATION_SOAK_CALIBRATE'] %}
    {% set z = c.point_z|float %}
    SET_GCODE_VARIABLE MACRO=DEEP_CALIBRATION_SOAK_CALIBRATE VARIABLE=raw_cur VALUE="{c.raw_cur + [z|round(6) if c.point_measured else none]}"
    SET_GCODE_VARIABLE MACRO=DEEP_CALIBRATION_SOAK_CALIBRATE VARIABLE=cur VALUE="{c.cur + [z|round(6) if c.point_valid else none]}"

[gcode_macro _DEEP_CALIBRATION_SOAK_EVAL]
gcode:
    {% set c = printer['gcode_macro DEEP_CALIBRATION_SOAK_CALIBRATE'] %}
    {% if c.running %}
        {% if c.cur|length != c.npts %}
            { action_raise_error('DEEP CALIBRATION: incomplete probing round cannot be accepted') }
        {% endif %}
        _DEEP_CALIBRATION_SOAK_EVALUATE T={params.T|default(printer.deep_calibration.host_time|float-c.t0|float)} TEST_ONLY={1 if params.T is defined else 0}
    {% endif %}

[gcode_macro _DEEP_CALIBRATION_SOAK_FINISH]
gcode:
    {% set c = printer['gcode_macro DEEP_CALIBRATION_SOAK_CALIBRATE'] %}
    {% set accepted = params.SETTLED|default(0)|int == 1 and c.last_good and c.confirm_count|int >= c.confirm|int %}
    {% set elapsed = params.ELAPSED|default(c.rows[-1][0] if c.rows|length else 0)|float %}
    {% set verified = elapsed|round(0,'ceil')|int %}
    SET_GCODE_VARIABLE MACRO=DEEP_CALIBRATION_SOAK_CALIBRATE VARIABLE=running VALUE=False
    UPDATE_DELAYED_GCODE ID=_DEEP_CALIBRATION_SOAK_TICK DURATION=0
    M140 S0
    M104 S0
    {% if accepted %}
        {% set complete = [] %}
        {% for row in c.rows %}
            {% if none not in row[1:] %}{% set _ = complete.append(row) %}{% endif %}
        {% endfor %}
        {% set baseline = complete[0] %}
        {% set centre_delta = c.rows[-1][1]-baseline[1] %}
        {% set warp = [] %}
        {% for j in range(2,c.npts|int+1) %}
            {% set _ = warp.append(((c.rows[-1][j]-baseline[j])-centre_delta)|abs) %}
        {% endfor %}
        # Invalidate first, commit method=2 last: interrupted saves cannot be AUTO-valid.
        SAVE_VARIABLE VARIABLE=soak_t{c.bed}_method VALUE=0
        SAVE_VARIABLE VARIABLE=soak_t{c.bed} VALUE={verified}
        SAVE_VARIABLE VARIABLE=soak_t{c.bed}_from VALUE={c['from']|round|int}
        SAVE_VARIABLE VARIABLE=soak_t{c.bed}_drift VALUE={centre_delta|round(6)}
        SAVE_VARIABLE VARIABLE=soak_t{c.bed}_warp VALUE={warp|max if warp|length else 0}
        SAVE_VARIABLE VARIABLE=soak_t{c.bed}_corners VALUE={verified if c.npts == 5 else 0}
        SAVE_VARIABLE VARIABLE=soak_t{c.bed}_points VALUE={c.npts}
        SAVE_VARIABLE VARIABLE=soak_t{c.bed}_stable VALUE={c.stable}
        SAVE_VARIABLE VARIABLE=soak_t{c.bed}_window VALUE={c.window}
        SAVE_VARIABLE VARIABLE=soak_t{c.bed}_repeat VALUE={c.repeat}
        SAVE_VARIABLE VARIABLE=soak_t{c.bed}_method VALUE=2
        SET_GCODE_VARIABLE MACRO=DEEP_CALIBRATION_SOAK_CALIBRATE VARIABLE=last_result VALUE='"ACCEPTED_STRICT"'
        RESPOND PREFIX="info" MSG="DEEP CALIBRATION: ACCEPTED strict {c.npts}-point soak at {c.bed} C: saved {verified} s actual verified time. No earlier settling time inferred."
    {% else %}
        SET_GCODE_VARIABLE MACRO=DEEP_CALIBRATION_SOAK_CALIBRATE VARIABLE=last_result VALUE='"TIMEOUT_OR_UNVERIFIED"'
        RESPOND PREFIX="info" MSG="DEEP CALIBRATION: NOT ACCEPTED at {verified} s; previous calibration preserved. A stable-looking average alone is insufficient."
    {% endif %}

[gcode_macro DEEP_CALIBRATION_SOAK_ABORT]
gcode:
    {% if printer['gcode_macro DEEP_CALIBRATION_SOAK_CALIBRATE'].running %}
        SET_GCODE_VARIABLE MACRO=DEEP_CALIBRATION_SOAK_CALIBRATE VARIABLE=running VALUE=False
        SET_GCODE_VARIABLE MACRO=DEEP_CALIBRATION_SOAK_CALIBRATE VARIABLE=last_result VALUE='"ABORTED"'
        UPDATE_DELAYED_GCODE ID=_DEEP_CALIBRATION_SOAK_TICK DURATION=0
        M140 S0
        M104 S0
        RESPOND PREFIX="info" MSG="DEEP CALIBRATION: aborted; nothing saved; heaters off"
    {% endif %}

[gcode_macro DEEP_CALIBRATION_SOAK_STATUS]
gcode:
    {% set bed = params.BED|default(60)|float|round|int %}
    {% set vars = printer.save_variables.variables %}
    {% set key = 'soak_t' ~ bed %}
    {% set c = printer['gcode_macro DEEP_CALIBRATION_SOAK_CALIBRATE'] %}
    {% if c.point_status|length %}
        RESPOND PREFIX="info" MSG="DEEP CALIBRATION: current/last point states (centre, front-left, front-right, rear-right, rear-left): {c.point_status}"
    {% endif %}
    {% if c.thermal_status %}
        RESPOND PREFIX="info" MSG="DEEP CALIBRATION: last thermal guard state {c.thermal_status}"
    {% endif %}
    {% if key in vars %}
        RESPOND PREFIX="info" MSG="DEEP CALIBRATION: saved {bed} C soak {[vars[key]|float,vars.get(key ~ '_corners',0)|float]|max} s; method {vars.get(key ~ '_method',0)} (2=strict, 0=legacy/unverified); points {vars.get(key ~ '_points',0)}. Last attempt: {c.last_result}. AUTO requires strict five-point calibration at the requested temperature."
    {% else %}
        RESPOND PREFIX="info" MSG="DEEP CALIBRATION: no saved {bed} C calibration. Last attempt: {c.last_result}."
    {% endif %}




[gcode_macro DC_MARK_GOOD]
description: Mark the current recorded first-layer setting visually GOOD
gcode:
    DEEP_CALIBRATION_MARK LABEL=GOOD
