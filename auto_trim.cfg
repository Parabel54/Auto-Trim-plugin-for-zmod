# ============================================================================
# auto_trim.cfg - self-learning first-layer Z offset for zMod
# (Flashforge AD5X, AD5M, AD5M Pro)
# Version 3.4.0 (2026-10-21). See CHANGELOG.md.
#
# Orca start G-code (two lines; zMod requires the literal START_PRINT line):
#   START_PRINT ... SKIP_LEVELING=True
#   AUTO_TRIM_PREPARE MATERIAL=<type>
#
# AUTO_TRIM_PREPARE runs, with one cool-down and one reheat:
#   1. nozzle clean. AD5X (CLEAN=TRASH, automatic): purge into the trash
#      chute at print temperature, wait there until the nozzle has cooled to
#      121 C (151 C above 230 C), then wipe on the rubber, so nothing oozes
#      onto the bed. AD5M / AD5M Pro (CLEAN=ZMOD): the standard zMod clean
#      (_ORIG_CLEAR_NOZZLE).
#   2. fresh KAMP mesh (or full mesh), probed cool
#   3. KAMP-area check: re-probes the corner nodes of the KAMP mesh and the node
#      nearest its centre (the area defined by the printed objects; CHECK=ALL
#      re-probes every node) and compares each with the mesh (same maths as
#      the zMod _TEST_POINT). The average difference is the drift: how far the
#      bed has moved up or down as a whole since the mesh was taken.
#   4. AUTO_TRIM: offset = calibration + material trim + drift. The drift is
#      compared with the learned drift of the material and the difference shown.
#   5. reheat once and push the filament back to the nozzle tip. On the AD5X
#      this happens at the trash chute, followed by a rubber wipe. Elsewhere
#      the nozzle reheats above the purge start point, outside the print area.
#   6. purge line outside the print area (parts plus clearance)
#
# End of print:    AUTO_TRIM_LEARN (before END_PRINT)
#   babysteps made during the print are saved, so the next print starts
#   where the previous one finished. Babysteps on the baseline material move the
#   calibration (and therefore every material); babysteps on any other
#   material move only the trim of that material. Each material also keeps a
#   learned drift (running average of its checks on finished prints) that
#   every new check is compared against. The offset is then reset to 0.
#
# First run: calibration starts from the existing zMod Z offset if one is
# loaded and inside the safety range, otherwise from default_calibration.
# Use AUTO_TRIM_SET to set it.
#
# Uses the zMod existing [save_variables]. Do not add another one.
# ============================================================================

[gcode_macro AUTO_TRIM]
description: Apply learned calibration + per-material Z trim
# Package version, shown by AUTO_TRIM_STATUS.
variable_version: "3.4.0"
# Material whose babysteps define the shared calibration.
variable_baseline: "pla"
# Starting calibration if no saved value and no usable zMod offset is loaded.
# Higher is safer (less squish); babystep down on the first print.
variable_default_calibration: 0.25
# Safety bounds on the final offset. Outside these, the print is stopped
# instead of risking the plate.
variable_min_offset: -0.8
variable_max_offset: 0.8
# On the first run, an existing offset anywhere in the safety range is
# adopted as the starting calibration. Offsets closer to 0 than this are
# treated as "never set" (zMod parks the offset at 0 or 0.001 while
# cleaning the nozzle), so the default is used instead.
variable_unset_below: 0.01
# Starting trims (mm, + = higher nozzle) relative to the baseline, used
# until a material has been learned. Names are Orca filament types,
# lowercased, with "-" and spaces as "_". Unlisted materials start at 0.
variable_seed_trims: {
    'pla_cf': -0.01,
    'petg':    0.025,
    'petg_cf': 0.04,
    'abs':     0.0,
    'asa':     0.01,
    'tpu':     0.025,
    'pa':      0.0,
    'pa_cf':   0.0,
    'pa6_cf':  0.0,
    'pa12_cf': 0.0,
    'pc':      0.0
    }
variable_applied: 0.0
variable_material: ""
variable_first_run: False
# Learned drift per material: share of each new check folded into the
# running average on finished prints, and the jump (mm) from the learned
# value that gets a console notice.
variable_drift_learn_rate: 0.5
variable_drift_jump: 0.1
# Set by the KAMP-area check in AUTO_TRIM_PREPARE, cleared once used.
variable_drift: 0.0
variable_check_points: 0
variable_check_spread: 0.0
# This drift of the print, kept for AUTO_TRIM_LEARN.
variable_print_drift: 0.0
variable_print_checked: False
gcode:
    {% set mat = params.MATERIAL|default(baseline)|lower|replace("-", "_")|replace(" ", "_") %}
    {% set vars = printer.save_variables.variables %}
    {% set drift = drift|float %}
    {% set current = printer.gcode_move.homing_origin.z|float %}

    {% if "trim_calibration" in vars %}
        {% set cal = vars.trim_calibration|float %}
        {% set cal_src = "saved" %}
    {% elif current|abs >= unset_below and current >= min_offset and current <= max_offset %}
        {% set cal = current|round(4) %}
        {% set cal_src = "from existing zMod offset" %}
    {% else %}
        {% set cal = default_calibration %}
        {% set cal_src = "default" %}
    {% endif %}

    {% if mat == baseline %}
        {% set trim = 0.0 %}
    {% else %}
        {% set trim = vars.get("trim_" ~ mat, seed_trims.get(mat, 0.0))|float %}
    {% endif %}

    {% set z = (cal + trim + drift)|round(4) %}

    {% if z < min_offset or z > max_offset %}
        { action_raise_error("AUTO_TRIM: offset " ~ z ~ " outside safe range " ~ min_offset ~ " to " ~ max_offset ~ ". Check with AUTO_TRIM_STATUS.") }
    {% endif %}

    {% if cal_src != "saved" %}
        SAVE_VARIABLE VARIABLE=trim_calibration VALUE={cal}
        SET_GCODE_VARIABLE MACRO=AUTO_TRIM VARIABLE=first_run VALUE=True
    {% else %}
        SET_GCODE_VARIABLE MACRO=AUTO_TRIM VARIABLE=first_run VALUE=False
    {% endif %}

    {% set checked = check_points|int > 0 %}
    {% if checked %}
        {% set learned = vars.get("drift_" ~ mat, none) %}
        {% if learned is none %}
            RESPOND PREFIX="info" MSG="AUTO TRIM: {mat|upper} drift this print {drift} ({check_points} points, spread {check_spread}), no learned drift yet"
        {% else %}
            {% set ddiff = (drift - learned|float)|round(4) %}
            RESPOND PREFIX="info" MSG="AUTO TRIM: {mat|upper} drift this print {drift} ({check_points} points, spread {check_spread}), learned {learned}, difference {ddiff}"
            {% if ddiff|abs >= drift_jump|float %}
                RESPOND PREFIX="!!" MSG="AUTO TRIM: {mat|upper} drift is {ddiff} mm away from its learned value. Plate swapped, reseated or dirty? Applying the measurement from this print."
            {% endif %}
        {% endif %}
    {% endif %}

    SET_GCODE_OFFSET Z={z} MOVE=1
    SET_GCODE_VARIABLE MACRO=AUTO_TRIM VARIABLE=applied VALUE={z}
    SET_GCODE_VARIABLE MACRO=AUTO_TRIM VARIABLE=material VALUE='"{mat}"'
    SET_GCODE_VARIABLE MACRO=AUTO_TRIM VARIABLE=print_drift VALUE={drift}
    SET_GCODE_VARIABLE MACRO=AUTO_TRIM VARIABLE=print_checked VALUE={checked}
    SET_GCODE_VARIABLE MACRO=AUTO_TRIM VARIABLE=drift VALUE=0.0
    SET_GCODE_VARIABLE MACRO=AUTO_TRIM VARIABLE=check_points VALUE=0
    RESPOND PREFIX="info" MSG="AUTO TRIM: {mat|upper} offset = calibration {cal} ({cal_src}) + trim {trim} + drift {drift} = {z}"


[gcode_macro AUTO_TRIM_PREPARE]
description: Clean, cool, mesh, KAMP-area check, trim and reheat, in one pass after START_PRINT
# Mesh to build: KAMP (adaptive, default) or FULL (whole bed).
variable_mesh: "KAMP"
# Nozzle clean before probing:
#   TRASH  - AD5X: purge into the trash chute, wait there until the nozzle
#            has cooled to probing temperature, then wipe on the rubber.
#            Nothing oozes onto the bed.
#   ZMOD   - the standard zMod clean (_ORIG_CLEAR_NOZZLE): wipe hot, probe
#            and scrub the bed front edge, then cool over the bed.
#   AUTO   - TRASH when the printer has the trash chute and rubber wiper
#            (AD5X), otherwise ZMOD (AD5M, AD5M Pro).
variable_clean: "AUTO"
# Optional wipe macro to run after reheating, e.g. "MY_WIPE". Empty = none.
variable_wipe_macro: ""
# Purge line before printing, placed outside the print area: the labelled
# parts plus purge_clearance mm (room for supports, brims and skirts), in the
# free strip between that area and the bed edge. The front is used when it
# has room, otherwise the side with the most room. If no side has room, the
# purge is skipped with a notice. PURGE=0 on the command line skips it.
variable_purge: True
variable_purge_clearance: 10.0
variable_purge_length: 30.0
variable_purge_amount: 30.0
variable_purge_height: 0.8
variable_purge_flow: 12.0
# Filament (mm) pushed back to the nozzle tip after reheating, to undo the
# retraction left by the zMod nozzle clean. -1 = automatic: 3 on the AD5X
# (its clean retracts 3 mm), 0 on the AD5M and AD5M Pro (no retraction).
variable_restore_tip: -1.0
# Points for the KAMP-area check: AREA (KAMP mesh corners + node nearest the
# centre) or ALL (every KAMP mesh node).
variable_check: "AREA"
# A check point this far from the fresh mesh means the probe or plate
# misbehaved, not a real shift: the print is stopped (zMod uses 0.31).
variable_max_drift: 0.3
# Largest spread between check points (max - min difference) accepted.
# More means the area is not moving as a whole: the print is stopped.
variable_max_spread: 0.4
# A mesh edge more than kamp_slack mm past the print (where the print is not
# near the bed edge) is reported as a full mesh rather than KAMP.
variable_kamp_slack: 10.0
gcode:
    {% set sp = printer["gcode_macro _START_PRINT"]|default({}) %}
    {% set vars = printer.save_variables.variables %}
    {% set ext = params.EXTRUDER_TEMP|default(sp.zextruder_temp|default(0))|float %}
    {% set bed = params.BED_TEMP|default(sp.zbed_temp|default(0))|float %}
    {% set mode = params.MESH|default(mesh)|upper %}
    {% set wipe = params.WIPE|default(wipe_macro)|string %}
    {% set do_purge = params.PURGE|default(1 if purge else 0)|int %}
    {% set tip_cfg = params.RESTORE_TIP|default(restore_tip)|float %}
    {% set is_ad5x = printer.configfile.settings.zmod_ifs is defined %}
    {% set tip = tip_cfg if tip_cfg >= 0 else (3.0 if is_ad5x else 0.0) %}
    {% set check_mode = params.CHECK|default(check)|upper %}
    {% set cmds = printer.gcode.commands %}
    {% set has_trash = "_GOTO_TRASH" in cmds and "_CLEAR_REZINA" in cmds and "_G28" in cmds %}
    {% set clean_mode = params.CLEAN|default(clean)|upper %}
    {% if clean_mode == "AUTO" %}
        {% set clean_mode = "TRASH" if has_trash else "ZMOD" %}
    {% endif %}
    {% if clean_mode not in ["TRASH", "ZMOD"] %}
        { action_raise_error("AUTO_TRIM_PREPARE: CLEAN must be AUTO, TRASH or ZMOD") }
    {% endif %}
    {% if clean_mode == "TRASH" and not has_trash %}
        { action_raise_error("AUTO_TRIM_PREPARE: CLEAN=TRASH needs the AD5X trash chute and rubber wiper (zMod _GOTO_TRASH, _CLEAR_REZINA). Use CLEAN=ZMOD on this printer.") }
    {% endif %}
    {% if clean_mode == "ZMOD" and "_ORIG_CLEAR_NOZZLE" not in cmds %}
        { action_raise_error("AUTO_TRIM_PREPARE: zMod macro _ORIG_CLEAR_NOZZLE not found. Is this zMod?") }
    {% endif %}

    {% for m in ["_KAMP_BED_MESH_CALIBRATE", "_BED_MESH_CALIBRATE", "LOAD_CELL_TARE", "PROBE", "_SMART_PARK"] %}
        {% if m not in cmds %}
            { action_raise_error("AUTO_TRIM_PREPARE: zMod macro " ~ m ~ " not found. Is this zMod?") }
        {% endif %}
    {% endfor %}
    {% if ext <= 0 or bed <= 0 %}
        { action_raise_error("AUTO_TRIM_PREPARE: no print temperatures. Put it right after the START_PRINT line, or pass EXTRUDER_TEMP and BED_TEMP.") }
    {% endif %}
    {% if mode not in ["KAMP", "FULL"] %}
        { action_raise_error("AUTO_TRIM_PREPARE: MESH must be KAMP or FULL") }
    {% endif %}
    {% if check_mode not in ["AREA", "ALL"] %}
        { action_raise_error("AUTO_TRIM_PREPARE: CHECK must be AREA or ALL") }
    {% endif %}
    {% if vars.get("mesh_test", 1)|int != 0 %}
        { action_raise_error("AUTO_TRIM_PREPARE: zMod MESH_TEST must be 0 (this macro does the check itself). Run SAVE_ZMOD_DATA MESH_TEST=0") }
    {% endif %}
    {% if vars.get("print_leveling", 0)|int != 0 %}
        { action_raise_error("AUTO_TRIM_PREPARE: zMod PRINT_LEVELING must be 0, or zMod builds its own mesh inside START_PRINT. Run SAVE_ZMOD_DATA PRINT_LEVELING=0") }
    {% endif %}
    {% if vars.get("disable_priming", 0)|int != 1 %}
        { action_raise_error("AUTO_TRIM_PREPARE: zMod priming must be off, or zMod draws a purge line inside START_PRINT before the offset is set. Run SAVE_ZMOD_DATA DISABLE_PRIMING=1") }
    {% endif %}
    {% if sp.zforce_kamp|default(False) or sp.zforce_leveling|default(False) or not sp.zskip_leveling|default(False) %}
        RESPOND PREFIX="!!" MSG="AUTO TRIM: START_PRINT should have SKIP_LEVELING=True and no FORCE_KAMP/FORCE_LEVELING. Otherwise zMod builds an extra mesh with its own heat/cool cycle first. Continuing."
    {% endif %}

    RESPOND PREFIX="info" MSG="AUTO TRIM: preparing ({mode} mesh, {clean_mode} clean, print {ext|int}/{bed|int} C)"
    BED_MESH_CLEAR
    {% if clean_mode == "TRASH" %}
        _AUTO_TRIM_TRASH_CLEAN EXTRUDER_TEMP={ext} BED_TEMP={bed}
    {% else %}
        _ORIG_CLEAR_NOZZLE EXTRUDER_TEMP={ext} BED_TEMP={bed}
    {% endif %}
    {% if mode == "KAMP" %}
        _KAMP_BED_MESH_CALIBRATE
    {% else %}
        _BED_MESH_CALIBRATE PROFILE=default
    {% endif %}
    _AUTO_TRIM_CHECK MODE={check_mode}
    AUTO_TRIM MATERIAL={params.MATERIAL|default("PLA")}
    {% if do_purge %}
        _AUTO_TRIM_PURGE_PLAN
    {% else %}
        SET_GCODE_VARIABLE MACRO=_AUTO_TRIM_PURGE VARIABLE=ok VALUE=False
    {% endif %}
    {% if clean_mode == "TRASH" %}
        _AUTO_TRIM_TRASH_FINISH EXTRUDER_TEMP={ext} BED_TEMP={bed} TIP={tip}
    {% else %}
        _AUTO_TRIM_PURGE_GOTO FALLBACK=_SMART_PARK
        M190 S{bed}
        M109 S{ext}
        {% if tip > 0 %}
            SAVE_GCODE_STATE NAME=_auto_trim_tip
            M83
            G1 E{tip} F300
            G92 E0
            RESTORE_GCODE_STATE NAME=_auto_trim_tip
            RESPOND PREFIX="info" MSG="AUTO TRIM: filament pushed back to the nozzle tip ({tip} mm)"
        {% endif %}
    {% endif %}
    {% if do_purge %}
        _AUTO_TRIM_PURGE
    {% endif %}
    {% if wipe %}
        {wipe}
    {% endif %}
    RESPOND PREFIX="info" MSG="AUTO TRIM: ready to print"

[gcode_macro _AUTO_TRIM_TRASH_CLEAN]
description: Internal (AD5X): purge into the trash chute, cool there, then wipe on the rubber
gcode:
    {% set ext = params.EXTRUDER_TEMP|float %}
    {% set bed = params.BED_TEMP|float %}
    {% set vars = printer.save_variables.variables %}
    {% set cool = vars.get("temp_test_max", 151)|int if ext > 230 else vars.get("temp_test_min", 121)|int %}
    RESPOND PREFIX="info" MSG="AUTO TRIM: nozzle clean at the trash chute: purge at {ext|int} C, cool to {cool} C, then wipe"
    _G28
    _GOTO_TRASH
    G1 Z20 F600
    M140 S{bed}
    M104 S{ext} T0
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed - 3} MAXIMUM={bed + 4}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={ext - 2} MAXIMUM={ext + 4}
    M106 S255
    G92 E0
    G1 E10 F400
    G92 E0
    G1 E-3 F1000
    M400
    G92 E0
    M104 S{cool} T0
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={cool - 3} MAXIMUM={cool + 3}
    _CLEAR_REZINA CLEAR_NOZ=1
    M106 S0
    G1 Z5 F6000
    M400
    LOAD_CELL_TARE

[gcode_macro _AUTO_TRIM_TRASH_FINISH]
description: Internal (AD5X): reheat at the trash chute, push the filament back to the tip, wipe on the rubber
gcode:
    {% set ext = params.EXTRUDER_TEMP|float %}
    {% set bed = params.BED_TEMP|float %}
    {% set tip = params.TIP|default(0)|float %}
    _GOTO_TRASH
    M190 S{bed}
    M109 S{ext}
    {% if tip > 0 %}
        SAVE_GCODE_STATE NAME=_auto_trim_tip
        M83
        G1 E{tip} F300
        G92 E0
        RESTORE_GCODE_STATE NAME=_auto_trim_tip
    {% endif %}
    M400
    _CLEAR_REZINA CLEAR_NOZ=1
    M400
    RESPOND PREFIX="info" MSG="AUTO TRIM: reheated at the trash chute, filament pushed back to the tip ({tip} mm), nozzle wiped"

[gcode_macro _AUTO_TRIM_PURGE_PLAN]
description: Internal: place the purge line outside the print area (labelled parts plus clearance)
gcode:
    {% set p = printer["gcode_macro AUTO_TRIM_PREPARE"] %}
    {% set clr = p.purge_clearance|float %}
    {% set L = p.purge_length|float %}
    {% set inset = 3.0 %}
    {% set bcfg = printer.configfile.settings.bed_mesh|default({}) %}
    {% set bmin = bcfg.mesh_min|default([0.0, 0.0]) %}
    {% set bmax = bcfg.mesh_max|default([215.0, 215.0]) %}
    {% set bx0 = bmin[0]|float %}
    {% set by0 = bmin[1]|float %}
    {% set bx1 = bmax[0]|float %}
    {% set by1 = bmax[1]|float %}
    {% set objs = printer.exclude_object.objects|default([]) %}
    {% set pts = objs|selectattr("polygon", "defined")|map(attribute="polygon")|sum(start=[]) %}
    {% set ok = True %}
    {% set side = "front" %}
    {% if pts|length == 0 %}
        {% set ox0 = bx0 %}
        {% set oy0 = by0 %}
        {% set ox1 = bx1 %}
        {% set oy1 = by1 %}
        {% set y = by0 + inset %}
        {% set xc = (bx0 + bx1) / 2 %}
        {% set sx = xc - L / 2 %}
        {% set ex = xc + L / 2 %}
        {% set sy = y %}
        {% set ey = y %}
        {% set where = "at the front edge (no labelled objects, print area unknown)" %}
    {% else %}
        {% set ox0 = pts|map(attribute=0)|min %}
        {% set oy0 = pts|map(attribute=1)|min %}
        {% set ox1 = pts|map(attribute=0)|max %}
        {% set oy1 = pts|map(attribute=1)|max %}
        {% set ax0 = ox0 - clr %}
        {% set ay0 = oy0 - clr %}
        {% set ax1 = ox1 + clr %}
        {% set ay1 = oy1 + clr %}
        {% set room = {"front": ay0 - by0, "back": by1 - ay1, "left": ax0 - bx0, "right": bx1 - ax1} %}
        {% set need = 2 * inset %}
        {% if room.front >= need %}
            {% set side = "front" %}
        {% else %}
            {% set best = room|dictsort(by="value")|last %}
            {% set side = best[0] %}
            {% if best[1] < need %}
                {% set ok = False %}
            {% endif %}
        {% endif %}
        {% if side in ["front", "back"] %}
            {% set y = (by0 + ay0) / 2 if side == "front" else (ay1 + by1) / 2 %}
            {% set span = [L, bx1 - bx0 - 2 * inset]|min %}
            {% set sx = [[(ox0 + ox1) / 2 - span / 2, bx0 + inset]|max, bx1 - inset - span]|min %}
            {% set ex = sx + span %}
            {% set sy = y %}
            {% set ey = y %}
        {% else %}
            {% set x = (bx0 + ax0) / 2 if side == "left" else (ax1 + bx1) / 2 %}
            {% set span = [L, by1 - by0 - 2 * inset]|min %}
            {% set sy = [[(oy0 + oy1) / 2 - span / 2, by0 + inset]|max, by1 - inset - span]|min %}
            {% set ey = sy + span %}
            {% set sx = x %}
            {% set ex = x %}
        {% endif %}
        {% set where = "on the " ~ side ~ " side, outside the print area (parts X" ~ ox0|round(1) ~ " to " ~ ox1|round(1) ~ " Y" ~ oy0|round(1) ~ " to " ~ oy1|round(1) ~ " plus " ~ clr ~ " mm clearance)" %}
    {% endif %}
    {% if ok %}
        SET_GCODE_VARIABLE MACRO=_AUTO_TRIM_PURGE VARIABLE=ok VALUE=True
        SET_GCODE_VARIABLE MACRO=_AUTO_TRIM_PURGE VARIABLE=sx VALUE={sx|round(2)}
        SET_GCODE_VARIABLE MACRO=_AUTO_TRIM_PURGE VARIABLE=sy VALUE={sy|round(2)}
        SET_GCODE_VARIABLE MACRO=_AUTO_TRIM_PURGE VARIABLE=ex VALUE={ex|round(2)}
        SET_GCODE_VARIABLE MACRO=_AUTO_TRIM_PURGE VARIABLE=ey VALUE={ey|round(2)}
        RESPOND PREFIX="info" MSG="AUTO TRIM: purge line planned {where}, from X{sx|round(1)} Y{sy|round(1)} to X{ex|round(1)} Y{ey|round(1)}"
    {% else %}
        SET_GCODE_VARIABLE MACRO=_AUTO_TRIM_PURGE VARIABLE=ok VALUE=False
        RESPOND PREFIX="!!" MSG="AUTO TRIM: no room for a purge line outside the print area (parts plus {clr} mm clearance fill the bed). Purge skipped."
    {% endif %}

[gcode_macro _AUTO_TRIM_PURGE_GOTO]
description: Internal: hover above the purge start point (outside the print area)
gcode:
    {% set pl = printer["gcode_macro _AUTO_TRIM_PURGE"] %}
    {% if pl.ok %}
        G90
        G1 Z5 F1800
        G1 X{pl.sx} Y{pl.sy} F12000
        M400
    {% elif params.FALLBACK is defined %}
        {params.FALLBACK}
    {% endif %}

[gcode_macro _AUTO_TRIM_PURGE]
description: Internal: draw the planned purge line
variable_ok: False
variable_sx: 0.0
variable_sy: 0.0
variable_ex: 0.0
variable_ey: 0.0
gcode:
    {% set p = printer["gcode_macro AUTO_TRIM_PREPARE"] %}
    {% if ok %}
        {% set h = p.purge_height|float %}
        {% set amount = p.purge_amount|float %}
        {% set speed = (p.purge_flow|float / 5.0) * 60 %}
        {% set dist = ((ex - sx) ** 2 + (ey - sy) ** 2) ** 0.5 %}
        {% set ux = (ex - sx) / dist if dist > 0 else 1 %}
        {% set uy = (ey - sy) / dist if dist > 0 else 0 %}
        SAVE_GCODE_STATE NAME=_auto_trim_purge
        G90
        G1 Z5 F1800
        G1 X{sx} Y{sy} F12000
        G1 Z{h} F600
        M83
        G1 X{ex} Y{ey} E{amount} F{speed}
        G1 E-0.5 F2100
        G1 X{(ex + ux * 5)|round(2)} Y{(ey + uy * 5)|round(2)} F12000
        G1 Z{h + 2} F600
        G92 E0
        RESTORE_GCODE_STATE NAME=_auto_trim_purge
        M400
        RESPOND PREFIX="info" MSG="AUTO TRIM: purge line drawn from X{sx} Y{sy} to X{ex} Y{ey} ({amount} mm of filament)"
    {% endif %}

[gcode_macro _AUTO_TRIM_CHECK]
description: Internal: verify the mesh, then probe the point nearest its centre while the nozzle is still cool
gcode:
    {% set p = printer["gcode_macro AUTO_TRIM_PREPARE"] %}
    {% set bm = printer.bed_mesh|default(none) %}
    {% if bm is none or not bm.profile_name or not bm.probed_matrix or not bm.probed_matrix[0] %}
        { action_raise_error("AUTO_TRIM: no bed mesh after meshing, nothing to check against.") }
    {% endif %}
    {% set mx0 = bm.mesh_min[0]|float %}
    {% set my0 = bm.mesh_min[1]|float %}
    {% set mx1 = bm.mesh_max[0]|float %}
    {% set my1 = bm.mesh_max[1]|float %}
    {% set cx = (mx0 + mx1) / 2 %}
    {% set cy = (my0 + my1) / 2 %}

    {% set objs = printer.exclude_object.objects|default([]) %}
    {% set pts = objs|selectattr("polygon", "defined")|map(attribute="polygon")|sum(start=[]) %}
    {% if pts|length == 0 %}
        RESPOND PREFIX="!!" MSG="AUTO TRIM: no labelled objects, so KAMP cannot size the mesh to the print. Turn on Label objects in Orca."
    {% else %}
        {% set ox0 = pts|map(attribute=0)|min %}
        {% set oy0 = pts|map(attribute=1)|min %}
        {% set ox1 = pts|map(attribute=0)|max %}
        {% set oy1 = pts|map(attribute=1)|max %}
        {% set bcfg = printer.configfile.settings.bed_mesh|default({}) %}
        {% set bmin = bcfg.mesh_min|default([0.0, 0.0]) %}
        {% set bmax = bcfg.mesh_max|default([215.0, 215.0]) %}
        {% set cx0 = [ox0, bmin[0]|float]|max %}
        {% set cy0 = [oy0, bmin[1]|float]|max %}
        {% set cx1 = [ox1, bmax[0]|float]|min %}
        {% set cy1 = [oy1, bmax[1]|float]|min %}
        {% if mx0 > cx0 + 0.5 or my0 > cy0 + 0.5 or mx1 < cx1 - 0.5 or my1 < cy1 - 0.5 %}
            { action_raise_error("AUTO_TRIM: the mesh (X" ~ mx0 ~ "-" ~ mx1 ~ " Y" ~ my0 ~ "-" ~ my1 ~ ") does not cover this print (X" ~ ox0|round(1) ~ "-" ~ ox1|round(1) ~ " Y" ~ oy0|round(1) ~ "-" ~ oy1|round(1) ~ ").") }
        {% endif %}
        {% set ks = p.kamp_slack|float %}
        {% set adaptive = (mx0 >= ox0 - ks or ox0 <= bmin[0]|float + ks)
                       and (my0 >= oy0 - ks or oy0 <= bmin[1]|float + ks)
                       and (mx1 <= ox1 + ks or ox1 >= bmax[0]|float - ks)
                       and (my1 <= oy1 + ks or oy1 >= bmax[1]|float - ks) %}
        {% if adaptive %}
            RESPOND PREFIX="info" MSG="AUTO TRIM: KAMP area X{mx0|round(1)}-{mx1|round(1)} Y{my0|round(1)}-{my1|round(1)} (print X{ox0|round(1)}-{ox1|round(1)} Y{oy0|round(1)}-{oy1|round(1)})"
        {% else %}
            RESPOND PREFIX="info" MSG="AUTO TRIM: full mesh X{mx0|round(1)}-{mx1|round(1)} Y{my0|round(1)}-{my1|round(1)} (print X{ox0|round(1)}-{ox1|round(1)} Y{oy0|round(1)}-{oy1|round(1)})"
        {% endif %}
    {% endif %}

    {% set ny = bm.probed_matrix|length %}
    {% set nx = bm.probed_matrix[0]|length %}
    {% set sx = (mx1 - mx0) / (nx - 1) if nx > 1 else 0 %}
    {% set sy = (my1 - my0) / (ny - 1) if ny > 1 else 0 %}
    {% set ns = [] %}
    {% for j in range(ny) %}
        {% for i in range(nx) %}
            {% set x = mx0 + i * sx %}
            {% set y = my0 + j * sy %}
            {% set _ = ns.append({"i": i, "j": j, "x": x, "y": y, "z": bm.probed_matrix[j][i]|float, "d": ((x - cx) ** 2 + (y - cy) ** 2) ** 0.5}) %}
        {% endfor %}
    {% endfor %}
    {% if params.MODE|default("AREA")|upper == "ALL" %}
        {% set pick = ns %}
    {% else %}
        {% set centre = (ns|sort(attribute="d"))[0] %}
        {% set pick = [] %}
        {% for n in ns %}
            {% if (n.i == 0 or n.i == nx - 1) and (n.j == 0 or n.j == ny - 1) %}
                {% set _ = pick.append(n) %}
            {% endif %}
        {% endfor %}
        {% if centre not in pick %}
            {% set _ = pick.append(centre) %}
        {% endif %}
    {% endif %}
    RESPOND PREFIX="info" MSG="AUTO TRIM: checking {pick|length} points across the KAMP area ({nx}x{ny} mesh)"
    SET_GCODE_VARIABLE MACRO=_AUTO_TRIM_CHECK_POINT VARIABLE=diffs VALUE="[]"
    SAVE_GCODE_STATE NAME=_auto_trim_check
    G90
    {% for n in pick %}
        G1 Z5 F600
        G1 X{n.x|round(3)} Y{n.y|round(3)} F6000
        M400
        LOAD_CELL_TARE
        PROBE
        G1 Z5 F300
        _AUTO_TRIM_CHECK_POINT X={n.x|round(3)} Y={n.y|round(3)} Z={n.z}
    {% endfor %}
    RESTORE_GCODE_STATE NAME=_auto_trim_check MOVE=0
    _AUTO_TRIM_CHECK_DONE

[gcode_macro _AUTO_TRIM_CHECK_POINT]
description: Internal: compare one probe with the mesh (zMod _TEST_POINT maths)
variable_diffs: []
gcode:
    {% set p = printer["gcode_macro AUTO_TRIM_PREPARE"] %}
    {% set vars = printer.save_variables.variables %}
    {% if vars.get("klipper13", 0)|int == 1 %}
        {% set zprobe = printer.probe.last_probe_position.z|float %}
        {% set zoff = 0.0 %}
    {% else %}
        {% set zprobe = printer.probe.last_z_result|float %}
        {% set zoff = (printer.configfile.settings.probe|default({})).z_offset|default(0.0)|float %}
    {% endif %}
    {% set zmesh = params.Z|float + zoff %}
    {% set d = (zprobe - zmesh)|round(4) %}
    RESPOND PREFIX="info" MSG="AUTO TRIM:   X{params.X} Y{params.Y}: probe {zprobe|round(4)} mesh {zmesh|round(4)} difference {d}"
    {% if d|abs >= p.max_drift|float %}
        { action_raise_error("AUTO_TRIM: check point X" ~ params.X ~ " Y" ~ params.Y ~ " differs from the fresh mesh by " ~ d ~ " mm (limit " ~ p.max_drift ~ "). The probe or plate misbehaved: check the plate is seated and clean, then reprint.") }
    {% endif %}
    {% set new = diffs + [d] %}
    SET_GCODE_VARIABLE MACRO=_AUTO_TRIM_CHECK_POINT VARIABLE=diffs VALUE="[{new|join(',')}]"

[gcode_macro _AUTO_TRIM_CHECK_DONE]
description: Internal: average the KAMP-area check into the drift
gcode:
    {% set p = printer["gcode_macro AUTO_TRIM_PREPARE"] %}
    {% set diffs = printer["gcode_macro _AUTO_TRIM_CHECK_POINT"].diffs %}
    {% if diffs|length == 0 %}
        { action_raise_error("AUTO_TRIM: the KAMP-area check produced no readings.") }
    {% endif %}
    {% set mean = ((diffs|sum) / (diffs|length))|round(4) %}
    {% set spread = ((diffs|max) - (diffs|min))|round(4) %}
    RESPOND PREFIX="info" MSG="AUTO TRIM: KAMP-area check: {diffs|length} points, drift (average) {mean}, spread {spread}"
    {% if spread > p.max_spread|float %}
        { action_raise_error("AUTO_TRIM: check points disagree by " ~ spread ~ " mm (limit " ~ p.max_spread ~ "), so the area is not moving as a whole. Check the plate is seated flat and clean, then reprint.") }
    {% endif %}
    SET_GCODE_VARIABLE MACRO=AUTO_TRIM VARIABLE=drift VALUE={mean}
    SET_GCODE_VARIABLE MACRO=AUTO_TRIM VARIABLE=check_points VALUE={diffs|length}
    SET_GCODE_VARIABLE MACRO=AUTO_TRIM VARIABLE=check_spread VALUE={spread}


[gcode_macro AUTO_TRIM_LEARN]
description: Save the babysteps from this print into the calibration or material trim
# Every babystep total is learned, any size, up or down. Babysteps are
# measured against the applied offset (which includes the drift of this print),
# so the drift itself is never learned. First-print
# babysteps always go to the calibration, whatever the material, since the
# starting value was only a guess. The safety range in AUTO_TRIM still
# stops the next print if a learned value puts the offset outside it.
gcode:
    {% set t = printer["gcode_macro AUTO_TRIM"] %}
    {% if t.material != "" %}
        {% set vars = printer.save_variables.variables %}
        {% if t.first_run or t.material == t.baseline %}
            {% set key = "trim_calibration" %}
            {% set old = vars.get(key, t.default_calibration)|float %}
            {% set label = "calibration" %}
        {% else %}
            {% set key = "trim_" ~ t.material %}
            {% set old = vars.get(key, t.seed_trims.get(t.material, 0.0))|float %}
            {% set label = t.material|upper ~ " trim" %}
        {% endif %}
        {% set delta = printer.gcode_move.homing_origin.z - t.applied %}

        {% if delta|abs < 0.001 %}
            RESPOND PREFIX="info" MSG="AUTO TRIM: no babysteps, {label} stays {old}"
        {% else %}
            {% set new = (old + delta)|round(4) %}
            SAVE_VARIABLE VARIABLE={key} VALUE={new}
            RESPOND PREFIX="info" MSG="AUTO TRIM: {label} {old} -> {new} (babysteps {delta|round(4)})"
        {% endif %}
        {% if t.print_checked %}
            {% set dkey = "drift_" ~ t.material %}
            {% set dnow = t.print_drift|float %}
            {% set dold = vars.get(dkey, none) %}
            {% if dold is none %}
                {% set dnew = dnow|round(4) %}
                RESPOND PREFIX="info" MSG="AUTO TRIM: learned {t.material|upper} drift (first) -> {dnew}"
            {% else %}
                {% set dnew = (dold|float + (dnow - dold|float) * t.drift_learn_rate|float)|round(4) %}
                RESPOND PREFIX="info" MSG="AUTO TRIM: learned {t.material|upper} drift {dold} -> {dnew} (this print {dnow}, difference {(dnow - dold|float)|round(4)})"
            {% endif %}
            SAVE_VARIABLE VARIABLE={dkey} VALUE={dnew}
        {% endif %}
        SET_GCODE_VARIABLE MACRO=AUTO_TRIM VARIABLE=material VALUE='""'
        SET_GCODE_VARIABLE MACRO=AUTO_TRIM VARIABLE=first_run VALUE=False
        SET_GCODE_VARIABLE MACRO=AUTO_TRIM VARIABLE=print_checked VALUE=False
    {% endif %}
    # End of every print: back to 0. The babysteps above were read before
    # this runs, so learning is unaffected.
    SET_GCODE_OFFSET Z=0
    RESPOND PREFIX="info" MSG="AUTO TRIM: Z offset reset to 0"


[gcode_macro AUTO_TRIM_STATUS]
description: Show the saved calibration and all learned material trims
gcode:
    {% set t = printer["gcode_macro AUTO_TRIM"] %}
    {% set vars = printer.save_variables.variables %}
    RESPOND PREFIX="info" MSG="AUTO TRIM v{t.version}: baseline={t.baseline|upper} calibration={vars.get('trim_calibration', 'not set yet')}"
    {% for k, v in vars.items()|sort if k.startswith("trim_") and k != "trim_calibration" %}
        RESPOND PREFIX="info" MSG="  {k[5:]|upper}: {v} (learned)"
    {% endfor %}
    {% for k, v in t.seed_trims.items()|sort if ("trim_" ~ k) not in vars %}
        RESPOND PREFIX="info" MSG="  {k|upper}: {v} (seed)"
    {% endfor %}
    {% for k, v in vars.items()|sort if k.startswith("drift_") %}
        RESPOND PREFIX="info" MSG="  learned drift {k[6:]|upper}: {v}"
    {% endfor %}


[gcode_macro AUTO_TRIM_SET]
description: Set the calibration or the trim of one material manually
# AUTO_TRIM_SET CALIBRATION=0.25
# AUTO_TRIM_SET MATERIAL=PETG TRIM=0.03
gcode:
    {% if params.CALIBRATION is defined %}
        {% set v = params.CALIBRATION|float %}
        SAVE_VARIABLE VARIABLE=trim_calibration VALUE={v}
        RESPOND PREFIX="info" MSG="AUTO TRIM: calibration set to {v}"
    {% elif params.MATERIAL is defined and params.TRIM is defined %}
        {% set mat = params.MATERIAL|lower|replace("-", "_")|replace(" ", "_") %}
        {% set v = params.TRIM|float %}
        SAVE_VARIABLE VARIABLE=trim_{mat} VALUE={v}
        RESPOND PREFIX="info" MSG="AUTO TRIM: {mat|upper} trim set to {v}"
    {% else %}
        { action_raise_error("Use AUTO_TRIM_SET CALIBRATION=<mm> or AUTO_TRIM_SET MATERIAL=<type> TRIM=<mm>") }
    {% endif %}
