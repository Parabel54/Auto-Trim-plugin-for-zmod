# Auto Trim shape mesh addon. Include it in mod_data/user.cfg, after Auto Trim:
#   [include auto_trim_shape_mesh/auto_trim_shape_mesh.cfg]
# Then use MESH=SHAPE on the AUTO_TRIM_PREPARE line (see the Auto Trim README).
[auto_trim_shape_mesh]
# How far from the printed objects grid points are probed, in grid spacings
# (1.0 = one spacing, enough for a smooth mesh right up to the part's edges)
#reach: 1.0
# Grid area around the objects, in mm (as KAMP)
#margin: 3
# Saved full-bed mesh the other points come from (AUTO_TRIM_MESH_CALIBRATE
# saves it as auto)
#base_profile: auto
# Warn when the saved mesh is off from the freshly probed points by more than
# this anywhere (mm): it no longer matches the bed and should be refreshed
#max_residual: 0.06
