# Builds the download zips on GitHub and attaches them to a release:
# automatically when a release is published, or by hand (Actions > Release
# assets > Run workflow) for an existing release tag.
name: Release assets
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach the zips for (e.g. v3.9.15)
        required: true
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      - name: Build the zips
        run: |
          set -eu
          V="${TAG#v}"
          mkdir -p out/zmod_auto_trim
          cp auto_trim.cfg README.md CHANGELOG.md out/zmod_auto_trim/
          if [ -d addons ]; then cp -r addons out/zmod_auto_trim/; fi
          find out -name __pycache__ -prune -exec rm -rf {} +
          (cd out && zip -rq "../zmod_auto_trim_v${V}_release.zip" zmod_auto_trim)
          if [ -f addons/auto_trim_shape_mesh/auto_trim_shape_mesh.py ]; then
            AV=$(sed -n "s/^VERSION = '\(.*\)'/\1/p" addons/auto_trim_shape_mesh/auto_trim_shape_mesh.py)
            (cd out/zmod_auto_trim/addons && zip -rq "../../../auto_trim_shape_mesh_addon_${AV}.zip" auto_trim_shape_mesh)
          fi
          ls -l *.zip
      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" *.zip --clobber --repo "${{ github.repository }}"
