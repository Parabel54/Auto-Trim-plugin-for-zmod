# Paste this section ONCE into mod_data/user.cfg, or include this sibling cfg.
# If this cfg is inside a deep_calibration_development_beta subfolder:
# [include deep_calibration_development_beta/deep_calibration.cfg]
[deep_calibration]
# A single accelerometer FIFO overflow is recorded as a gap (accel_overflow
# event) and recording continues; more than accel_overflow_limit overflows
# within 60 s stop the recording.
#accel_overflow_limit: 3
# Auto Trim (installed separately) owns print preparation; Deep Calibration
# keeps the research, recording and soak calibration tools.
startup_integration: False
# Infer the preceding first-layer interval from relative manual Z babysteps:
# moving closer labels the previous offset TOO_HIGH, moving away TOO_LOW.
auto_adjust_labels: True
# First print test without console input: put DEEP_CALIBRATION_ARM on the
# slicer start G-code (after AUTO_TRIM_PREPARE). Recording starts with the
# first layer; when layer auto_stop_layer starts, the offset kept last is
# labelled GOOD (unless you labelled it yourself) and recording stops.
auto_capture: True
auto_stop_layer: 2
# Background read of the active uploaded G-code; no extra slicer start parameters.
# Unknown source/roles/timing stay recorded but cannot feed automatic knee fitting.
gcode_context: True
# When to read the print file for the slicer context (10.2.4): soak (default)
# reads it while Auto Trim's bed heat soak waits, and not at all when there is
# no soak wait; arm reads it when Deep Calibration is armed (10.2.2), which on
# the printer competes with the first layer.
#gcode_context_start: soak
segment_settle: 0.5
# Knee search (DEEP_CALIBRATION_KNEE): the only command that changes the
# print. During the first layer it raises the nozzle by knee_start, then lowers
# it by knee_step every knee_hold seconds until the median load cell force rises
# knee_rise_g above the recent level, confirmed by the next step. The offset is
# then set knee_margin above that point. It stops (offset put back) when the
# first layer ends first, or after knee_max_travel without a knee; a step
# knee_max_force_g above the recent level stops it at once.
# Each step lasts knee_hold s at least, then until its median is within
# knee_se_g, or knee_hold_max s. The rise needed is knee_noise_k times the
# measured step-to-step noise (at least knee_rise_min_g; knee_rise_g until the
# noise is known). The knee is fitted through all steps; with knee_confirm the
# search steps back up to measure it from both sides. The margin is learned per
# material and nominal volumetric flow (knee_margins.json beside the recordings).
#knee_start: 0.10
#knee_step: 0.01
#knee_hold: 6
#knee_hold_max: 20
#knee_se_g: 2
#knee_rise_g: 12
#knee_noise_k: 4
#knee_rise_min_g: 6
# Legacy fallback only with knee_require_margin=False; not experimentally validated.
#knee_margin: 0.125
#knee_require_margin: True
#poll_accelerate: True
# The load cell driver's pause after each reading and wait for each reply
# while recording (restored afterwards). 0.05 s gives about 6-7 readings per
# second (0 is the board's ceiling, about 10; 0.1 about 5)
poll_pause: 0.05
#poll_wait: 0.05
# Force zero taken automatically after the last tare, before the first layer
# touches (10.3.5); a manual DEEP_CALIBRATION_ZERO takes precedence
#auto_zero: True
#auto_zero_max_iqr: 500
#auto_zero_min_readings: 6
#auto_zero_min_span: 1
# A drift check counts only for a steady moment in the air: enough readings,
# constant height and speed, little scatter; a large jump must be confirmed
#drift_min_readings: 3
#drift_max_iqr: 300
#drift_max_step: 800
# The load cell board's conversion period, for each reading's measurement time
#board_period: 0.1
#knee_fast_hold: 2
#knee_up_hold: 12
#knee_up_settle: 6
#knee_learn_rate: 0.5
#knee_confirm: True
#knee_max_force_g: 80
#knee_max_travel: 0.35
log_directory: /usr/data/config/mod_data/deep_calibration_data
context_interval: 0.1
# Thin optional recording data and recover as host timing permits.
load_guard: True
filter_tau: 0.5
# Raw counts per gram of the load cell, for force in grams (0: counts only).
# 52.56 was measured on the maintainer's AD5X with a 580 g weight, from raw
# counts (the board's own grams move in 19 g steps). Measure your own printer
# and change it, or set 0. Keep only this one counts_per_gram line: Klipper
# uses the last one in a section, so a second line silently overrides it.
counts_per_gram: 52.56
part_fan: fan_generic fanM106
max_file_mb: 256

# Continuous acquisition for the entire START -> STOP/MAX/print-end session.
# Set ACCEL=0 / ADC=0 on START only when intentionally collecting a baseline.
accel_default: 1
adc_default: 1
accelerometer: lis2dw
# Verified supplied Klipper 13 uses batch callbacks. Native legacy paths may
# require scalar; select explicitly, never guess from ADC value/timestamp.
adc_callback_format: batch
accel_rotate_mb: 32
accel_max_mb: 512
storage_reserve_mb: 64

# Bundled startup, cooling wipes and standalone soak calibration.
# Auto Trim shape mesh (10.2.4): MESH=SHAPE on Auto Trim 3.9.14 or later
# probes only the mesh grid points near the printed objects and fills the rest
# from the saved full-bed mesh. The same module as Auto Trim's optional addon;
# with Deep Calibration installed, the addon need not be installed separately.
[auto_trim_shape_mesh]
#reach: 1.0
#margin: 3
#base_profile: auto
#max_residual: 0.06

[include deep_calibration_start.cfg]

# Auto Trim owns print preparation. It is not bundled: install Auto Trim for
# zMod 3.9.9 or later and include it in mod_data/user.cfg as its README says.
[include deep_calibration_auto_mesh.cfg]

# Development-only guarded native approach; final contacts remain 1 mm/s.
[deep_calibration_approach]
approach_speed: 5
slow_clearance: 1
reference_max_age: 300
