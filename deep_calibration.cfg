# Paste this section ONCE into mod_data/user.cfg, or include this sibling cfg.
# If this cfg is inside a deep_calibration_development_beta subfolder:
# [include deep_calibration_development_beta/deep_calibration.cfg]
[deep_calibration]
# Auto Trim (installed separately) owns print preparation; Deep Calibration
# keeps the research, recording and soak calibration tools.
startup_integration: False
# Infer the preceding first-layer interval from relative manual Z babysteps:
# moving closer labels the previous offset TOO_HIGH, moving away TOO_LOW.
auto_adjust_labels: True
# First print test without console input: put DEEP_CALIBRATION_ARM on the
# slicer start G-code (after AUTO_TRIM_PREPARE). Recording starts with the
# first layer; when layer auto_stop_layer starts, the offset kept last is
# labelled GOOD (unless you labelled it yourself) and recording stops.
auto_capture: True
auto_stop_layer: 2
# Knee search (DEEP_CALIBRATION_KNEE): the only command that changes the
# print. During the first layer it raises the nozzle by knee_start, then lowers
# it by knee_step every knee_hold seconds until the median load cell force rises
# knee_rise_g above the recent level, confirmed by the next step. The offset is
# then set knee_margin above that point. It stops (offset put back) when the
# first layer ends first, or after knee_max_travel without a knee; a step
# knee_max_force_g above the recent level stops it at once.
#knee_start: 0.10
#knee_step: 0.01
#knee_hold: 8
#knee_rise_g: 12
#knee_margin: 0.025
#knee_max_force_g: 80
#knee_max_travel: 0.35
log_directory: /usr/data/config/mod_data/deep_calibration_data
context_interval: 0.1
filter_tau: 0.5
# 0 preserves raw/count-based analysis without assuming a grams conversion.
# Set a signed counts-per-gram value only after independent sensor calibration.
counts_per_gram: 0
part_fan: fan_generic fanM106
max_file_mb: 256

# Continuous acquisition for the entire START -> STOP/MAX/print-end session.
# Set ACCEL=0 / ADC=0 on START only when intentionally collecting a baseline.
accel_default: 1
adc_default: 1
accelerometer: lis2dw
# Verified supplied Klipper 13 uses batch callbacks. Native legacy paths may
# require scalar; select explicitly, never guess from ADC value/timestamp.
adc_callback_format: batch
accel_rotate_mb: 32
accel_max_mb: 512
storage_reserve_mb: 64

# Bundled startup, cooling wipes and standalone soak calibration.
[include deep_calibration_start.cfg]

# Auto Trim owns print preparation. It is not bundled: install Auto Trim for
# zMod 3.9.9 or later and include it in mod_data/user.cfg as its README says.
[include deep_calibration_auto_mesh.cfg]

# Development-only guarded native approach; final contacts remain 1 mm/s.
[deep_calibration_approach]
approach_speed: 5
slow_clearance: 1
reference_max_age: 300
