[gcode_macro _CLEAR_REZINA]
description: Cleaning the nozzle on rubber
gcode:
    SET_VELOCITY_LIMIT VELOCITY=600 ACCEL=20000
    {% set client = printer['gcode_macro _CLIENT_VARIABLE'] | default({}) %}
    {% set clear_noz = params.CLEAR_NOZ|default(0)|int %}

    RESPOND PREFIX="info" MSG="Cleaning the nozzle on rubber"

    _PREPARE_GOTO_TRASH_OR_WIPE

    M400
    {% if clear_noz == 1 %}
        G1 Y{client.custom_park_y-20} F5000 ; выезд из мусорки
        G1 Y{client.custom_park_y} F5000    ; заезд обратно в мусорку
        G1 Y{client.custom_park_y-20} F5000 ; выезд из мусорки
        G1 Y{client.custom_park_y} F5000    ; заезд обратно в мусорку
        G1 Y{client.custom_park_y-20} F5000 ; выезд из мусорки
        G1 Y{client.custom_park_y} F5000    ; заезд обратно в мусорку    
    {% endif %}

    G1 Y{client.custom_park_y-20} F15000 ; выезд из мусорки
    G1 X70 F12000       ; 1/4 резинки по X
    G1 Y{client.custom_park_y} F3000    ; заезд на резинку по Y
    G1 X78 F12000       ; 3/4 резинки по X
    G1 X65 F12000       ; 1/4 резинки по X

    G1 X80 F22000             ; 1/2 резинки по X
    G1 X65 F22000             ; 1/4 резинки по X
    G1 X80 F22000             ; 1/2 резинки по X
    G1 X65 F22000             ; 1/4 резинки по X
    G1 X80 F22000             ; 1/2 резинки по X
    G1 X65 F22000             ; 1/4 резинки по X
    G92 E0
    G1 E-2 F350

    G1 X81 F6000             ; 1/2 резинки по X
    G1 X65 F6000             ; 1/4 резинки по X
    G1 X81 F6000             ; 1/2 резинки по X
    G1 X65 F6000             ; 1/4 резинки по X
    G1 X81 F6000             ; 1/2 резинки по X
    G1 X65 F6000             ; 1/4 резинки по X

    G1 Y{client.max_y} F22000 ; выезд с резинки
    M400

