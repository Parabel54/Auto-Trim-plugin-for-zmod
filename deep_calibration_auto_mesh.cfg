# Included by deep_calibration.cfg. Run DC_CALIBRATE_ONE_MM_AUTO_MESH while idle.
# The mesh is probed with the nozzle at 230 C; for a saved mesh that matches
# Auto Trim (121 C after cleaning), use AUTO_TRIM_MESH_CALIBRATE instead.
# Starts below 40 C. Saves cold soak calibration, then mesh profile auto.
# SAVE_CONFIG persists the mesh and restarts Klipper after completion.

[gcode_macro DC_CALIBRATE_ONE_MM_AUTO_MESH]
description: Cold 60C soak at 1mm/s, then 230/60C full 9x9 mesh saved as auto
variable_active: False
gcode:
    {% set c = printer['gcode_macro DEEP_CALIBRATION_SOAK_CALIBRATE'] %}
    {% if active or c.running or printer.print_stats.state in ['printing','paused'] %}
        { action_raise_error('Calibration or print already active') }
    {% endif %}
    {% if printer.heater_bed.temperature|float >= 40 %}
        { action_raise_error('Let the bed cool below 40 C before this cold calibration') }
    {% endif %}
    SET_GCODE_VARIABLE MACRO=DC_CALIBRATE_ONE_MM_AUTO_MESH VARIABLE=active VALUE=True
    DEEP_CALIBRATION_SOAK_CALIBRATE BED=60 NOZZLE=121 POINTS=5 SAMPLES=2 PROBE_SPEED=1 SECOND_PROBE_SPEED=1 REPEAT=0.02 RETRIES=0 STABLE=0.02 INTERVAL=90 WINDOW=600 MIN_SOAK=600 MAX=2700 CONFIRM=2 TEMP_GRACE=300 BED_BAND_START=3 BED_BAND_FINAL=1
    UPDATE_DELAYED_GCODE ID=_DC_ONE_MM_AUTO_WAIT DURATION=1

[delayed_gcode _DC_ONE_MM_AUTO_WAIT]
gcode:
    {% set job = printer['gcode_macro DC_CALIBRATE_ONE_MM_AUTO_MESH'] %}
    {% set c = printer['gcode_macro DEEP_CALIBRATION_SOAK_CALIBRATE'] %}
    {% if job.active %}
        {% if c.running %}
            UPDATE_DELAYED_GCODE ID=_DC_ONE_MM_AUTO_WAIT DURATION=1
        {% elif c.last_result == 'ACCEPTED_STRICT' and c.last_good and c.confirm_count|int >= c.confirm|int %}
            SET_GCODE_VARIABLE MACRO=DC_CALIBRATE_ONE_MM_AUTO_MESH VARIABLE=active VALUE=False
            _DC_ONE_MM_AUTO_MESH
        {% else %}
            SET_GCODE_VARIABLE MACRO=DC_CALIBRATE_ONE_MM_AUTO_MESH VARIABLE=active VALUE=False
            RESPOND PREFIX="info" MSG="Soak not accepted; auto mesh was not replaced."
        {% endif %}
    {% endif %}

[gcode_macro _DC_ONE_MM_AUTO_MESH]
gcode:
    {% if printer.print_stats.state in ['printing','paused'] %}
        { action_raise_error('Print active; mesh cancelled') }
    {% endif %}
    RESPOND PREFIX="info" MSG="Soak accepted. Heating to nozzle 230 C / bed 60 C for full 9x9 mesh."
    M140 S60
    M104 S230
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM=59 MAXIMUM=61
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM=229 MAXIMUM=231
    G4 P120000
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM=59 MAXIMUM=61
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM=229 MAXIMUM=231
    BED_MESH_CLEAR
    G90
    G1 Z10 F600
    M400
    LOAD_CELL_TARE
    G4 P1000
    # Native alias ensures full mesh, bypassing zMod's optional KAMP wrapper.
    _BED_MESH_CALIBRATE PROFILE=auto PROBE_COUNT=9,9 ALGORITHM=bicubic ADAPTIVE=0 PROBE_SPEED=1 LIFT_SPEED=5 SAMPLE_RETRACT_DIST=2 SAMPLES=2 SAMPLES_RESULT=median SAMPLES_TOLERANCE=0.02 SAMPLES_TOLERANCE_RETRIES=4
    BED_MESH_PROFILE SAVE=auto
    M104 S0
    M140 S0
    RESPOND PREFIX="info" MSG="9x9 auto mesh complete; persisting with SAVE_CONFIG and restarting Klipper."
    SAVE_CONFIG
